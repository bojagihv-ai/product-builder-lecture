<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>떡집 찾기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>떡집 찾기 🍡</h1>
            <p>전국의 모든 떡집을 간편하게 찾아보세요.</p>
        </header>
        <main>
            <div class="search-box">
                <input type="text" id="region-input" placeholder="예: 서울 강남구">
                <button id="search-button">검색</button>
            </div>
            <div id="results-container">
                <!-- 검색 결과가 여기에 표시됩니다 -->
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>

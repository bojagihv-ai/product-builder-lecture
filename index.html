<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lotto Number Generator</h1>
            <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
        </div>
        <div id="weather" class="weather">Loading temperature...</div>
        <div class="controls">
            <label class="upload">
                <span>Upload Background</span>
                <input id="bg-upload" type="file" accept="image/*">
            </label>
        </div>
        <div class="controls">
            <label class="select">
                <span>City</span>
                <select id="city-select">
                    <option value="37.5665,126.9780">Seoul</option>
                    <option value="35.1796,129.0756">Busan</option>
                    <option value="37.4563,126.7052">Incheon</option>
                    <option value="37.2636,127.0286">Suwon</option>
                    <option value="35.1595,126.8526">Gwangju</option>
                </select>
            </label>
            <label class="select">
                <span>Refresh (min)</span>
                <input id="refresh-interval" type="number" min="1" max="120" value="10">
            </label>
        </div>
        <div class="numbers"></div>
        <button id="generate">Generate Numbers</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
